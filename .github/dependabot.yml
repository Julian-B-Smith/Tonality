# Dependabot (ROADMAP gap 27(c)). Two ecosystems, both weekly:
#
#   * github-actions — keeps the SHA pins in .github/workflows moving. A pin
#     nobody updates is a frozen vulnerability; Dependabot rewrites the SHA and
#     its `# vX.Y.Z` comment together.
#   * pip on pyproject.toml, with `versioning-strategy: increase-if-necessary`:
#     a range is touched only when a release falls OUTSIDE it, so this fires
#     on a new major past a ceiling, not on every patch. mcp 2.x is ignored
#     below until gap 29 ports the server; widening that ceiling is the port,
#     never a routine bump. The default strategy raised every floor instead
#     (#305–#309, opened 2026-10-09 minutes after #302 merged), which the
#     first version of this comment wrongly said would not happen.
#
# The hash-pinned `requirements/*.lock` files are refreshed with the command in
# their header (`uv pip compile ...`), followed by `scripts/sbom.py`;
# tests/test_supply_chain.py fails a PR that bumps one without the other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    ignore:
      # The <2 ceiling is load-bearing until gap 29 ports build_server() to the
      # 2.x API: mcp 2.0 removed mcp.server.fastmcp. Dependabot proposed <3 on
      # 2026-10-30 (#312), it merged with every check green, and the documented
      # install broke. tests/test_supply_chain.py now fails that PR; this stops
      # it being re-proposed weekly. The upstream canary's "newest" leg is the
      # signal that 2.x moved. Remove this block in gap 29's port PR.
      - dependency-name: "mcp"
        versions: [">=2"]
