name: Upstream canary

# Watches what the per-PR gate deliberately cannot: the world moving under the
# locks. Network-dependent and time-varying by nature, so it is a measured
# signal on a schedule (Layer-E), never a merge gate — a red run here means
# "upstream changed; look", not "this PR broke something".
#
#   * mcp (ceiling): the newest `mcp` INSIDE our `<2` ceiling — exactly what
#     `pip install 'mts[mcp]'` gives a user today — through the server tests.
#     Closes ROADMAP gap 29's blind spot: no CI leg had ever exercised the real
#     SDK, which is how the 2.0.0 break reached users first. Red here = a break
#     users are about to hit. Must stay green.
#   * mcp (newest): the newest release, ceiling ignored. Gap 29's progress
#     meter, NOT a failure signal: red until build_server() is ported to the
#     2.x API (measured red on 2.3.0, 2026-10-09). continue-on-error keeps a
#     known, recorded gap from paging anyone weekly; the job log still shows it.
#   * vulnerability-scan: pip-audit over both hash-pinned locks (transitive
#     deps included, which GitHub's graph does not see in `.lock` files).
#
# The same checks run locally with `bash scripts/upstream-canary.sh` when
# Actions is unavailable.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC; off the hour to dodge the queue spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ceiling, newest]
    continue-on-error: ${{ matrix.target == 'newest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the package, then the newest mcp the target allows
        # Unlocked on purpose: tracking upstream is this job's whole point.
        # The ceiling leg resolves the extra itself (eager upgrade), so the
        # bound is read from pyproject.toml rather than restated here to drift.
        run: |
          if [ "${{ matrix.target }}" = ceiling ]; then
            python -m pip install --upgrade --upgrade-strategy eager -e '.[dev,mcp]'
          else
            python -m pip install -e '.[dev]'
            python -m pip install --upgrade mcp
          fi
          python -m pip show mcp | head -2
      - name: Server tests against that SDK
        run: python -m pytest tests/test_mcp_tools.py tests/test_resource_limits.py -q

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: pip-audit both locks
        run: |
          python -m pip install pip-audit
          for lock in requirements/*.lock; do
            echo "== $lock"
            pip-audit --require-hashes --disable-pip -r "$lock"
          done
