name: CI

# Enforce the green suite the project already achieves locally: run the dev
# suite (tests/) and the audit invariants (audit/checks/) on every PR and on
# main. Catches golden drift, the port-pin fingerprint, and regressions before
# merge — the accountability the Stop-hook gives locally, made mandatory.
#
# Supply chain (ROADMAP gap 27(c), 2026-10-09): third-party actions are pinned
# to full commit SHAs (a tag can be moved under us; a SHA cannot), the token is
# read-only, and dependencies install from the hash-pinned lock, so CI tests
# exactly the bytes the lock names. tests/test_supply_chain.py fails any
# workflow that drops a pin or its `permissions:` block.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor and the dev version — the ends of requires-python.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (hash-pinned lock, then the package itself without deps)
        # The lock is universal across the matrix (env markers cover <3.11).
        # The two MCP-SDK tests skip without the optional `mcp` extra, exactly
        # as it does locally; the weekly upstream canary covers the server.
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps -e .
      - name: Dev suite (the conformance golden + the port-pin fingerprint gate here)
        run: python -m pytest tests/ -q
      - name: Audit invariants (fenced out of the dev suite; run explicitly here)
        run: python -m pytest audit/checks/ -q
